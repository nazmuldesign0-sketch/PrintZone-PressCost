name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PrintZone-PressCost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icon and splash
        run: npx capacitor-assets generate --android

      - name: Add custom Android code
        run: |
          D=android/app/src/main/java/com/printzone/presscost
          cp android-overrides/MainActivity.java $D/MainActivity.java
          cp android-overrides/AndroidBridge.java $D/AndroidBridge.java

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PressCost.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PressCost-APK
          path: PrintZone-PressCost/PressCost.apk
